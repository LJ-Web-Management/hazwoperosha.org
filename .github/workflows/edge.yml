name: Deploy edge worker

# Tests edge/worker.mjs (Markdown content negotiation and Markdown 404s) and, once the repository has a
# CLOUDFLARE_API_TOKEN secret, deploys it in front of GitHub Pages and checks the live site.
# Prerequisites and secrets: README.md, "Markdown content negotiation".
on:
  push:
    branches: [main]
    paths: ['edge/**', 'tests/edge.test.js', 'tests/github-pages.js', 'tools/check-live.mjs', '.github/workflows/edge.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: edge
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Test worker
        run: node --test tests/edge.test.js
      - name: Explain skipped deploy
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice::CLOUDFLARE_API_TOKEN is not set, so the worker was tested but not deployed. See README.md, Markdown content negotiation."
      - name: Deploy worker
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: edge
        run: npx --yes wrangler@4 deploy
      - name: Check the live site (apex, as audits scan it)
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: node tools/check-live.mjs https://hazwoperosha.org
